name: CD 部署（手动触发）

# 只手动触发，不会在 push 时自动跑。
# 需要先在仓库 Settings → Secrets and variables → Actions 里配好 4 个 Secrets：
#   SSH_HOST        服务器 IP 或域名
#   SSH_USER        登录用户，例如 root
#   SSH_PRIVATE_KEY 私钥全文（-----BEGIN ... END----- 整段）
#   DEPLOY_DIR      服务器上放 jar 的目录，例如 /opt/tingshu
#   RESTART_CMD     部署后执行的重启命令，例如 cd /opt/tingshu && ./restart.sh

on:
  workflow_dispatch:
    inputs:
      module:
        description: '要部署的模块目录（相对仓库根目录）'
        required: true
        default: 'server-gateway'
      skip_tests:
        description: '跳过测试（部署时建议 true，CI 已经跑过了）'
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    name: 打包 + 上传 + 重启
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 打包目标模块（含它依赖的模块）
        run: |
          mvn -B -ntp -s .github/maven-settings.xml \
            -pl ${{ inputs.module }} -am package \
            ${{ inputs.skip_tests && '-DskipTests' || '' }}

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 上传 jar
        run: |
          JAR=$(find ${{ inputs.module }}/target -maxdepth 1 -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -1)
          if [ -z "$JAR" ]; then echo "没找到 jar，检查模块路径是否正确"; exit 1; fi
          echo "上传 $JAR"
          scp -i ~/.ssh/deploy_key "$JAR" \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_DIR }}/

      - name: 重启服务
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "${{ secrets.RESTART_CMD }}"
