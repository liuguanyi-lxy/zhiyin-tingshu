name: CD 部署（手动触发）

# 部署通道：GitHub runner 通过 Tailscale 临时加入 tailnet，走 100.x 内网 SSH 部署。
# 安全组只对 tailnet（100.64.0.0/10）开放，公网已封——runner 必须入网才能连到服务器。
#
# 一次性前置配置：
# 1. Tailscale 管理台 → Settings → OAuth clients（旧版为 Keys）→ Generate OAuth client，
#    权限选 Devices: Core 的 Read & Write，记下 TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET
# 2. Tailscale 管理台 → Access controls → 在 tagOwners 中增加： "tag:ci": ["autogroup:admin"]
# 3. GitHub 仓库 → Settings → Secrets and variables → Actions，配置 6 个 Secrets：
#      TS_OAUTH_CLIENT_ID   Tailscale OAuth 客户端 ID
#      TS_OAUTH_SECRET      Tailscale OAuth 客户端密钥
#      SSH_HOST             100.118.146.116（tailnet 内网地址，公网已封禁）
#      SSH_USER             root
#      SSH_PRIVATE_KEY      部署用私钥全文（对应服务器 authorized_keys 中的公钥）
#      DEPLOY_DIR           /opt/tingshu
# 4. 服务器上已放置 /opt/tingshu/restart.sh（见仓库 deploy/restart.sh）

on:
  workflow_dispatch:
    inputs:
      module:
        description: '要部署的模块目录（相对仓库根目录，如 server-gateway）'
        required: true
        default: 'server-gateway'
      skip_tests:
        description: '跳过测试（CI 已跑过时建议 true）'
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    name: 打包 + 入网 + 上传 + 重启
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 打包目标模块（含依赖模块）
        run: |
          mvn -B -ntp -s .github/maven-settings.xml \
            -pl ${{ inputs.module }} -am package \
            ${{ inputs.skip_tests && '-DskipTests' || '' }}

      - name: 连入 Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: github-actions-runner

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 首次跨区连接经 DERP 中继建立可能超过 keyscan 默认 5 秒，放宽超时并重试
          for i in 1 2 3 4 5; do
            if ssh-keyscan -H -T 20 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "known_hosts 写入成功（第 $i 次尝试）"; break
            fi
            echo "keyscan 第 $i 次失败，10 秒后重试"; sleep 10
            if [ "$i" = "5" ]; then echo "keyscan 连续 5 次失败"; exit 1; fi
          done

      - name: 上传 jar 并重启
        run: |
          JAR=$(find ${{ inputs.module }}/target -maxdepth 1 -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -1)
          if [ -z "$JAR" ]; then echo "没找到 jar，检查模块路径是否正确"; exit 1; fi
          echo "准备上传 $JAR"
          TARGET_DIR="${{ secrets.DEPLOY_DIR }}"
          [ -z "$TARGET_DIR" ] && TARGET_DIR="/opt/tingshu"
          SCP_OPTS="-i ~/.ssh/deploy_key -o ConnectTimeout=30 -o ServerAliveInterval=10"
          ssh $SCP_OPTS ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p $TARGET_DIR/logs"
          scp $SCP_OPTS "$JAR" \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$TARGET_DIR/
          ssh $SCP_OPTS ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash $TARGET_DIR/restart.sh ${{ inputs.module }}"
