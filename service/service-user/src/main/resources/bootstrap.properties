# 应用名称配置
spring.application.name=service-user
# 指定激活的开发环境配置
spring.profiles.active=dev
# 允许Bean定义覆盖，解决Spring Boot 2.x版本中可能出现的Bean冲突问题
spring.main.allow-bean-definition-overriding=true
# Nacos服务发现配置，指定Nacos服务器地址
spring.cloud.nacos.discovery.server-addr=47.119.114.135:8848
# Nacos配置中心配置，指定Nacos服务器地址
spring.cloud.nacos.config.server-addr=47.119.114.135:8848
# Nacos配置中心的前缀，使用应用名称作为前缀
spring.cloud.nacos.config.prefix=${spring.application.name}
# 指定Nacos配置中心的文件扩展名
spring.cloud.nacos.config.file-extension=yaml
