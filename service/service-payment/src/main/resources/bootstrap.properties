# Spring应用配置
# 应用名称，用于标识微服务
spring.application.name=service-payment
# 指定激活的开发环境配置
spring.profiles.active=dev
# 允许Bean定义覆盖，解决同名Bean冲突问题
spring.main.allow-bean-definition-overriding=true
# Nacos服务发现配置
# Nacos服务器地址，用于服务注册与发现
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
# Nacos配置中心配置
# Nacos配置服务器地址，用于获取配置信息
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
# 配置文件前缀，通常与应用名称相同
spring.cloud.nacos.config.prefix=${spring.application.name}
# 配置文件扩展名，指定为yaml格式
spring.cloud.nacos.config.file-extension=yaml
